[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "anchor-harness"
version = "0.4.0"
description = "Pure deterministic workflow planning and an agent workflow plugin"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Pradeep Kaushik"}]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8", "PyYAML>=6"]

[project.scripts]
anchor-plan = "anchor_harness.__main__:main"

[tool.setuptools.packages.find]
where = ["skills/anchor-orchestrator/scripts"]
include = ["anchor_harness*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
